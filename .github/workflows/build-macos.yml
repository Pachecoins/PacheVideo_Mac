name: Build PacheVideo macOS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build app
        run: bash build.sh

      - name: Create PKG installer
        run: bash create_pkg.sh

      - name: Zip app bundle
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent PacheVideo.app ../installer_output/PacheVideo_macOS_app.zip

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PacheVideo-macOS
          path: |
            installer_output/PacheVideo_macOS_v1.0.0.pkg
            installer_output/PacheVideo_macOS_app.zip
          retention-days: 30
